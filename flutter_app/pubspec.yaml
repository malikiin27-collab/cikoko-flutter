name: cikoko_native
description: Aplikasi Flutter native Kelurahan Cikoko, terhubung ke website PHP.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.0
  geolocator: ^14.0.2
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
