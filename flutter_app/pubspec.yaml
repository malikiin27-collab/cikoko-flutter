name: cikoko_native
description: Aplikasi Flutter native Kelurahan Cikoko, terhubung ke website PHP.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.0
  geolocator: ^14.0.2
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  # pdf 3.11.x requires archive <4.1.0; avoid the incompatible 4.4+ series.
  archive: ">=4.0.9 <4.1.0"
# A transitive image dependency may otherwise resolve to 4.11.0, which
# calls ZLibDecoder.decodeLazy (absent from archive 4.0.9).
# Keep the last compatible pre-4.11 image release for the current PDF stack.
dependency_overrides:
  image: 4.10.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
